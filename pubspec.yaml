name: my_3d_engine
description: A personal 3D engine built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  three_js: ^0.1.0
  three_js_controls: ^0.1.0
  # فعلاً برای جلوگیری از تداخل نسخه در گیت‌هاب، لودر را فعلا کامنت می‌کنیم
  # three_js_core_loaders: ^0.0.1 
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true